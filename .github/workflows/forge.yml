name: Forge

on:
  push:
    branches: [main]
    paths:
      - "contracts/guard/**"
      - ".github/workflows/forge.yml"
  pull_request:
    paths:
      - "contracts/guard/**"
      - ".github/workflows/forge.yml"

concurrency:
  group: forge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: forge test (contracts/guard)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts/guard
    steps:
      - uses: actions/checkout@v4
      # Pinned to the version the snapshot was taken with; gas metering differs
      # between releases (1.8.1 measured the accept path 21k above 1.7.1).
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge --version
      - run: forge build
      - run: forge test -vv
      # The committed snapshot is the gas record cited in docs/specs/10-guard-wrapper.md.
      # Fork tests skip themselves without CROSSFOOT_FORK_URL, so the snapshot excludes them.
      # The fork tests skip without the secret and report zero gas, which the tolerance
      # arithmetic rejects, so they are excluded from the snapshot on both sides.
      - run: forge snapshot --check --tolerance 5 --no-match-contract Fork
      # Mainnet fork replay (test/ForkMorpho.t.sol): only when the repository holds the
      # CROSSFOOT_FORK_URL secret (an archive endpoint). Skipped otherwise.
      - name: Fork tests
        env:
          CROSSFOOT_FORK_URL: ${{ secrets.CROSSFOOT_FORK_URL }}
        run: |
          if [ -z "$CROSSFOOT_FORK_URL" ]; then echo "no CROSSFOOT_FORK_URL secret, fork tests skipped"; exit 0; fi
          FOUNDRY_PROFILE=fork forge test --match-contract Fork -vv
