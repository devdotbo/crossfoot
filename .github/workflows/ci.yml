name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Library and binary targets: every warning is an error.
      - run: cargo clippy --workspace --lib --bins -- -D warnings
      # Test targets as well. dead_code is allowed in this pass only because
      # the vendored ACTUS vector harness (engine/tests/pam_test_vectors.rs)
      # mirrors the upstream JSON schema with fields it never reads, and that
      # file is kept as vendored (see engine/VENDORED.md).
      - run: cargo clippy --workspace --all-targets -- -D warnings -A dead_code

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Offline suite only. Live cross-checks are marked #[ignore] and need
      # the network; they are not run here.
      - run: cargo test --workspace

  build:
    name: Build release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      # The checked-in evidence bundles verify with the binary just built:
      # every file re-hashed, every cache key recomputed, the result
      # replayed from the bundle's own raw responses without the network.
      # A fixture directory without a manifest.json is not a bundle and is
      # skipped. The producer's code identity differs from CI's build, so
      # --require-same-code is deliberately not given; a replay mismatch
      # still fails the job.
      - name: Verify the checked-in fixture bundles
        run: |
          set -eu
          found=0
          for dir in cli/tests/fixtures/*/; do
            [ -f "$dir/manifest.json" ] || continue
            found=1
            echo "== $dir"
            ./target/release/crossfoot verify "$dir"
            (cd "$dir" && sha256sum -c --quiet SHA256SUMS)
          done
          [ "$found" = 1 ] || { echo "no fixture bundle found"; exit 1; }
