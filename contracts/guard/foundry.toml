[profile.default]
src = "src"
out = "out"
test = "test"
libs = []
# Pinned: the same solc, optimizer and EVM settings locally and in CI so bytecode and
# the gas snapshot are identical.
solc_version = "0.8.26"
bytecode_hash = "none"
cbor_metadata = false
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
gas_reports = ["CrossfootGuard", "CrossfootAttestations"]
fs_permissions = []

[fmt]
line_length = 100
tab_width = 4

# Mainnet fork tests (test/Fork*.t.sol) run only with CROSSFOOT_FORK_URL set and need an
# EVM that executes the live feed's bytecode:
#   FOUNDRY_PROFILE=fork forge test --match-contract Fork -vv
[profile.fork]
evm_version = "cancun"
